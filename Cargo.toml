[package]
name = "noema"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
rodio = { version = "0.17", default-features = false }
rand = "0.8"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
